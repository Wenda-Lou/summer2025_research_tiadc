<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIADC Loop Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout idea: instrument readout. Summary chips first, one wide overview chart,
   then synced small multiples that share one crosshair. Blue = channel A / the
   measurement, orange = channel B / batch decisions; status colors only for PASS/FAIL. */
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --ink: #0f1720;
  --ink-2: #4a5563;
  --muted: #8a94a3;
  --line: #dfe4eb;
  --grid: #edf0f4;
  --s1: #2a78d6;
  --s2: #eb6834;
  --good: #0a8f0a;
  --critical: #d03b3b;
  --band: rgba(10, 143, 10, 0.08);
  --ph-pre: rgba(100, 116, 139, 0.07);
  --ph-train: rgba(42, 120, 214, 0.06);
  --ph-hold: rgba(10, 143, 10, 0.07);
  --sel: #0f1720;
  --font-body: "IBM Plex Sans", "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111316;
    --surface: #1a1c20;
    --ink: #eef0f3;
    --ink-2: #b9bfc8;
    --muted: #7f8894;
    --line: #2d3138;
    --grid: #24282e;
    --s1: #3987e5;
    --s2: #d95926;
    --good: #2fbf2f;
    --critical: #e66767;
    --band: rgba(47, 191, 47, 0.10);
    --ph-pre: rgba(160, 170, 185, 0.06);
    --ph-train: rgba(57, 135, 229, 0.08);
    --ph-hold: rgba(47, 191, 47, 0.08);
    --sel: #eef0f3;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111316;
  --surface: #1a1c20;
  --ink: #eef0f3;
  --ink-2: #b9bfc8;
  --muted: #7f8894;
  --line: #2d3138;
  --grid: #24282e;
  --s1: #3987e5;
  --s2: #d95926;
  --good: #2fbf2f;
  --critical: #e66767;
  --band: rgba(47, 191, 47, 0.10);
  --ph-pre: rgba(160, 170, 185, 0.06);
  --ph-train: rgba(57, 135, 229, 0.08);
  --ph-hold: rgba(47, 191, 47, 0.08);
  --sel: #eef0f3;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 2px 0 0; max-width: 68ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 500 13px var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--s1); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, tr:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.btn input { display: none; }
.datasets { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 13px var(--font-body); color: var(--ink-2); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  display: inline-flex; gap: 8px; align-items: center;
}
.chip b { font-weight: 600; color: var(--ink); }
.chip .kind { font: 500 11px var(--font-mono); color: var(--muted); text-transform: uppercase; }
.chip[aria-pressed="true"] { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.card .note { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font: 500 19px var(--font-mono); margin-top: 2px; }
.tile .v small { font-size: 12px; color: var(--ink-2); font-weight: 400; }
.status { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--font-mono); padding: 1px 7px; border-radius: 999px; }
.status.pass { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
.status.fail { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { min-width: 0; }
.panel .ph { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; margin-bottom: 2px; }
.panel .ph h3 { font-size: 13px; font-weight: 600; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dot { width: 7px; height: 7px; border-radius: 50%; }
.legend i.tick { width: 2px; height: 10px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font: 11px var(--font-mono); }
.tip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font: 12px var(--font-mono);
  box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none;
}
.tip .t { color: var(--muted); margin-bottom: 2px; }
.tip .r { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tip .r span:first-child { color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.tip .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 12px var(--font-body); background: var(--surface); color: var(--ink-2); border: 0; padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
td { font-family: var(--font-mono); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--grid); }
tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--s1) 12%, transparent); }
.detailhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.badge { font: 500 11px var(--font-mono); color: var(--s1); border: 1px solid var(--s1); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.empty { color: var(--ink-2); border: 1px dashed var(--line); border-radius: 12px; padding: 24px; text-align: center; }
.msg { color: var(--critical); font-size: 13px; }
.drop {
  position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 85%, transparent); z-index: 20;
  display: none; align-items: center; justify-content: center; border: 3px dashed var(--s1); font-size: 18px; font-weight: 600;
}
body.dragging .drop { display: flex; }
code { font-family: var(--font-mono); font-size: 12.5px; }
@media (prefers-reduced-motion: no-preference) { .chip, .btn { transition: border-color .15s; } }
</style>
</head>

    if (kind === "summary" || kind === "frames") {

  const corr = [
    { title: "Gain 修正係數 − 1", unit: "%", a: "ga", b: "gb", dp: 4 },
    { title: "Offset 修正（各通道）", unit: "codes", a: "oa", b: "ob", dp: 3 }
  ];
  for (const c of corr) {
    panel(left, c.title + ` <span style="color:var(--muted);font-weight:400">(${c.unit})</span>`,
      [{ name: "通道 A", color: s1 }, { name: "通道 B", color: s2 }],
      Object.assign({}, base, { unit: c.unit, label: c.title, series: [
        { name: "通道 A", color: s1, type: "step", pts: rows.map(r => [r.x, r[c.a]]), unit: c.unit, dp: c.dp },
        { name: "通道 B", color: s2, type: "step", pts: rows.map(r => [r.x, r[c.b]]), unit: c.unit, dp: c.dp }
      ] }));
  }
  panel(left, "Skew actuator code", null, Object.assign({}, base, { unit: "", label: "actuator code",
    series: [{ name: "code", color: s1, type: "step", pts: rows.map(r => [r.x, r.code]), unit: "", dp: 0 }] }));
}

/* ---------- views ---------- */
function renderChips() {
  const host = document.getElementById("datasets");
  host.innerHTML = state.datasets.map((d, i) =>
    `<button class="chip" aria-pressed="${i === state.active}" data-i="${i}"><span class="kind">${d.kind === "sweep" ? d.axis + " 掃描" : "run"}</span><b>${esc(d.name)}</b></button>`).join("");
  host.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { state.active = +b.dataset.i; state.selected = null; render(); }));
}
function tile(k, v, small) { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}${small ? ` <small>${small}</small>` : ""}</div></div>`; }
function statusPill(pass) { return pass ? `<span class="status pass">✓ PASS</span>` : `<span class="status fail">✕ FAIL</span>`; }
function zoomControl() {
  return `<div class="seg" role="group" aria-label="y 軸範圍"><button data-z="all" aria-pressed="${state.zoom === "all"}">y 軸：全程</button><button data-z="settled" aria-pressed="${state.zoom === "settled"}">只看收斂後</button></div>`;
}
function bindZoom(root) {
  root.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { state.zoom = b.dataset.z; render(); }));
}

function renderRun(view, d) {
  const rows = d.rows; const ok = rows.filter(r => r.st === "ok");
  const last = ok.slice(-20);
  const sk = stats(last.map(r => r.skew)), gn = stats(last.map(r => r.gain)), of = stats(last.map(r => r.off));
  const moves = rows.filter(r => /^move/.test(r.act)).length;
  const lastCode = [...rows].reverse().find(r => fin(r.code));
  const rejects = rows.length - ok.length;
  const rejectKinds = {}; rows.filter(r => r.st !== "ok").forEach(r => rejectKinds[r.st] = (rejectKinds[r.st] || 0) + 1);
  view.innerHTML = `
    <div class="tiles">
      ${tile("合格 / 擷取", `${ok.length} / ${rows.length}`)}
      ${tile("拒收", rejects, Object.entries(rejectKinds).map(([k, v]) => k + " " + v).join(", "))}
      ${tile("Skew 移動", moves, "次")}
      ${tile("最後 code", lastCode ? lastCode.code : "—")}
      ${tile("Skew，最後 20 幀", fmt(sk.mean, 2), `± ${fmtU(sk.sd, 2)} ps`)}
      ${tile("Gain 殘差，最後 20 幀", fmt(gn.mean, 4), `± ${fmtU(gn.sd, 4)} %`)}
      ${tile("Offset B−A，最後 20 幀", fmt(of.mean, 3), `± ${fmtU(of.sd, 3)} codes`)}
    </div>
    <section class="card" style="margin-top:16px">
      <div class="detailhead"><div><h2>收斂過程</h2><p class="note">每個點是一幀；藍線是 20 個合格幀的移動平均；橘點是每次 skew 批次決策用的平均。滑鼠移到圖上，所有圖會對齊同一幀。最後 20 幀的 ± 是標準差。</p></div>${zoomControl()}</div>
      <div class="traj"></div>
    </section>`;
  bindZoom(view);
  trajectory(view.querySelector(".traj"), rows, { group: "run", xName: "幀", skewBand: { y0: -10, y1: 10 } });
}

function renderSweep(view, d) {
  const A = d.A; const rows = d.rows;
  const pts = [...new Set(rows.map(r => r.point))].sort((a, b) => a - b);
  const reps = [...new Set(rows.map(r => r.repeat))].sort((a, b) => a - b);
  const npass = rows.filter(r => r.pass).length;
  if (!state.selected) {
    const firstFail = rows.find(r => !r.pass && d.runs.has(r.point + "|" + r.repeat));
    const any = rows.find(r => d.runs.has(r.point + "|" + r.repeat));
    const s = firstFail || any; state.selected = s ? s.point + "|" + s.repeat : null;
  }
  const holdYield = stats(rows.map(r => r.holdAcc / r.holdBudget)).mean;
  view.innerHTML = `
    <div class="tiles">
      ${tile("掃描的軸", d.axis)}
      ${tile("門檻", "±" + fmtU(d.tol, A.dp > 3 ? 3 : 2), A.unit)}
      ${tile("注入點 × 重複", `${pts.length} × ${reps.length}`, `${rows.length} 次`)}
      ${tile("PASS", `${npass} / ${rows.length}`, npass === rows.length ? "全部通過" : `${rows.length - npass} 次失敗`)}
      ${tile("HOLD 合格率", fin(holdYield) ? (holdYield * 100).toFixed(0) + "%" : "—")}
    </div>
    <section class="card" style="margin-top:16px">
      <h2>HOLD 殘差 vs 注入量</h2>
      <p class="note">每個點是一次重複：凍結回授後 HOLD 的平均殘差，誤差線是 ±1.96×SE。綠色帶是門檻 ±${fmtU(d.tol, 3)} ${A.unit}；判定 PASS 需要 |平均| + 1.96·SE 落在門檻內（實心 ✓），失敗是空心圈，沒有 HOLD 資料的畫在頂端 ✕。點一下看那次的 PRE / TRAIN / HOLD 曲線。</p>
      <div class="chart" id="sweepchart"></div>
      ${legendHTML([{ name: "PASS", color: "var(--good)", cls: "dot" }, { name: "FAIL", color: "var(--critical)", cls: "dot" }, { name: "門檻帶", color: "var(--band)" }])}
    </section>
    <section class="card" style="margin-top:16px" id="detail"></section>
    <section class="card" style="margin-top:16px">
      <h2>每次重複的結果</h2>
      <p class="note">PRE 是注入後、訓練前讀到的平均失配；HOLD 是訓練完凍結後的殘差。點一列看曲線。</p>
      <div class="tablewrap"><table>
        <thead><tr><th>注入量</th><th>重複</th><th>PRE 平均</th><th>HOLD 平均</th><th>SE</th><th>|平均|+1.96·SE</th><th>HOLD 合格</th><th class="l">拒收原因</th><th>最後 code</th><th class="l">結果</th></tr></thead>
        <tbody>${rows.map(r => {
          const k = r.point + "|" + r.repeat;
          const rej = Object.entries(r.rejects).map(([a, b]) => a + " " + b).join(", ") || "—";
          return `<tr tabindex="0" data-k="${k}" aria-selected="${k === state.selected}"><td>${fmt(r.point, 0).replace("+0", "0")}</td><td>${r.repeat + 1}</td><td>${fmt(r.pre, A.dp)}</td><td>${fmt(r.mean, A.dp)}</td><td>${fmtU(r.se, A.dp)}</td><td>${fmtU(r.bound, A.dp)}</td><td>${fmtU(r.holdAcc, 0)}/${fmtU(r.holdBudget, 0)}</td><td class="l">${esc(rej)}</td><td>${fmtU(r.code, 0)}</td><td class="l">${statusPill(r.pass)}</td></tr>`;
        }).join("")}</tbody></table></div>
    </section>`;
  view.querySelectorAll("tbody tr").forEach(tr => {
    const go = () => { state.selected = tr.dataset.k; render(); document.getElementById("detail").scrollIntoView({ block: "nearest" }); };
    tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  sweepChart(document.getElementById("sweepchart"), d, pts, reps);
  renderDetail(document.getElementById("detail"), d);
}

function sweepChart(host, d, pts, reps) {
  const A = d.A; const W = Math.max(300, host.clientWidth), H = 300; const m = { l: 62, r: 16, t: 16, b: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let lo = -d.tol * 1.6, hi = d.tol * 1.6;
  for (const r of d.rows) if (fin(r.mean)) { lo = Math.min(lo, r.mean - 1.96 * r.se); hi = Math.max(hi, r.mean + 1.96 * r.se); }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const yt = niceTicks(lo, hi, 6); lo = Math.min(lo, yt.ticks[0]); hi = Math.max(hi, yt.ticks[yt.ticks.length - 1]);
  const slot = iw / pts.length;
  const X = (p, rep) => m.l + slot * (pts.indexOf(p) + 0.5) + (reps.length > 1 ? (reps.indexOf(rep) - (reps.length - 1) / 2) * Math.min(14, slot * 0.7 / reps.length) : 0);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * ih;
  let g = "";
  for (const t of yt.ticks) { g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${Y(t) + 3.5}" text-anchor="end">${tickLabel(t, yt.step)}</text>`; }
  g += `<rect x="${m.l}" y="${Y(d.tol)}" width="${iw}" height="${Y(-d.tol) - Y(d.tol)}" fill="var(--band)"/>`;
  g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  pts.forEach((p, i) => { const cx = m.l + slot * (i + 0.5);
    if (i) g += `<line x1="${m.l + slot * i}" x2="${m.l + slot * i}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--grid)"/>`;
    g += `<text x="${cx}" y="${m.t + ih + 16}" text-anchor="middle">${tickLabel(p, 1)}</text>`; });
  g += `<text x="${m.l + iw / 2}" y="${H - 6}" text-anchor="middle">注入量（${d.axis === "gain" ? "IFC code" : d.axis === "skew" ? "相對 code" : "ADC codes"}）</text>`;
  g += `<text x="14" y="${m.t + ih / 2}" text-anchor="middle" transform="rotate(-90 14 ${m.t + ih / 2})">HOLD 殘差 (${A.unit})</text>`;
  let marks = "";
  d.rows.forEach((r, i) => {
    const k = r.point + "|" + r.repeat; const cx = X(r.point, r.repeat); const sel = k === state.selected;
    if (!fin(r.mean)) {
      marks += `<g data-i="${i}" class="mk"><text x="${cx}" y="${m.t + 10}" text-anchor="middle" style="fill:var(--critical);font-size:13px">✕</text><circle cx="${cx}" cy="${m.t + 6}" r="11" fill="transparent"/>${sel ? `<circle cx="${cx}" cy="${m.t + 6}" r="9" fill="none" stroke="var(--sel)" stroke-width="1.5"/>` : ""}</g>`;
      return;
    }
    const col = r.pass ? "var(--good)" : "var(--critical)"; const cy = Y(r.mean);
    marks += `<g data-i="${i}" class="mk"><line x1="${cx}" x2="${cx}" y1="${Y(r.mean - 1.96 * r.se)}" y2="${Y(r.mean + 1.96 * r.se)}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`
      + `<circle cx="${cx}" cy="${cy}" r="5" fill="${r.pass ? col : "var(--surface)"}" stroke="${r.pass ? "var(--surface)" : col}" stroke-width="2"/>`
      + (sel ? `<circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="var(--sel)" stroke-width="1.5"/>` : "")
      + `<circle cx="${cx}" cy="${cy}" r="12" fill="transparent"/></g>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="HOLD residual versus injected point">${g}${marks}</svg><div class="tip"></div>`;
  const tip = host.querySelector(".tip"); const svg = host.querySelector("svg");
  host.querySelectorAll(".mk").forEach(el => {
    const r = d.rows[+el.dataset.i];
    el.style.cursor = "pointer";
    el.addEventListener("mouseenter", () => {
      const rej = Object.entries(r.rejects).map(([a, b]) => a + " " + b).join(", ");
      tip.innerHTML = `<div class="t">注入 ${tickLabel(r.point, 1)} · 重複 ${r.repeat + 1}</div>`
        + `<div class="r"><span>HOLD 平均</span><span>${fmt(r.mean, A.dp)} ${A.unit}</span></div>`
        + `<div class="r"><span>±1.96·SE</span><span>${fmtU(1.96 * r.se, A.dp)} ${A.unit}</span></div>`
        + `<div class="r"><span>PRE 平均</span><span>${fmt(r.pre, A.dp)} ${A.unit}</span></div>`
        + `<div class="r"><span>HOLD 合格</span><span>${fmtU(r.holdAcc, 0)}/${fmtU(r.holdBudget, 0)}</span></div>`
        + (rej ? `<div class="r"><span>拒收</span><span>${esc(rej)}</span></div>` : "")
        + `<div class="r"><span>結果</span><span style="color:${r.pass ? "var(--good)" : "var(--critical)"}">${r.pass ? "✓ PASS" : "✕ FAIL"}</span></div>`;
      tip.style.display = "block";
      const b = svg.getBoundingClientRect(), e = el.getBoundingClientRect();
      let lx = e.left - b.left + 18; if (lx + tip.offsetWidth > b.width) lx = e.left - b.left - tip.offsetWidth - 8;
      tip.style.left = Math.max(0, lx) + "px"; tip.style.top = Math.max(0, e.top - b.top - 10) + "px";
    });
    el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    el.addEventListener("click", () => { state.selected = r.point + "|" + r.repeat; render(); });
  });
}

function renderDetail(host, d) {
  const r = d.rows.find(x => x.point + "|" + x.repeat === state.selected);
  if (!r) { host.innerHTML = `<h2>單次曲線</h2><p class="note">點上面的點或下面的列，看那一次的曲線。</p>`; return; }
  const frames = d.runs.get(state.selected);
  const A = d.A;
  const head = `<div class="detailhead"><div><h2>注入 ${tickLabel(r.point, 1)} · 重複 ${r.repeat + 1} ${statusPill(r.pass)}</h2>
    <p class="note">HOLD ${fmt(r.mean, A.dp)} ± ${fmtU(1.96 * r.se, A.dp)} ${A.unit}（門檻 ±${fmtU(d.tol, 3)}）；PRE ${fmt(r.pre, A.dp)} ${A.unit}。灰底 PRE 量測、藍底 TRAIN 只訓練這個軸、綠底 HOLD 全部回授凍結。</p></div>${frames ? zoomControl() : ""}</div>`;
  if (!frames) { host.innerHTML = head + `<p class="empty">這個資料集沒有 frames.csv，所以沒有逐幀曲線。把同一個資料夾的 <code>frames.csv</code> 一起拖進來就會出現。</p>`; return; }
  host.innerHTML = head + `<div class="traj"></div>`;
  bindZoom(host);
  const tol = d.tol;
  const holdX = frames.filter(f => f.phase === "hold");
  const opts = { group: "detail", xName: "嘗試", graded: A.key };
  if (A.key === "skew") opts.skewBand = { y0: -tol, y1: tol }; else opts.skewBand = { y0: -10, y1: 10 };
  if (A.key === "gain") opts.gainBand = { y0: -tol, y1: tol };
  if (A.key === "off") opts.offBand = { y0: -tol, y1: tol };
  trajectory(host.querySelector(".traj"), frames, opts);
}

function render() {
  groups.clear();
  renderChips();
  const view = document.getElementById("view");
  const d = state.datasets[state.active];
  if (!d) { view.innerHTML = `<div class="empty">還沒有資料。用右上角的按鈕，或把 <code>calibration_out</code> 裡的檔案／資料夾拖進來。</div>`; return; }
  if (d.kind === "sweep") renderSweep(view, d); else renderRun(view, d);
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });

/* ---------- embedded examples ---------- */
try {
  const raw = document.getElementById("embedded").textContent.trim();
  if (raw && raw[0] === "{") {
    const emb = JSON.parse(raw);
    const files = [];
    for (const ds of emb.datasets || []) for (const [nm, text] of Object.entries(ds.files)) files.push({ path: ds.name + "/" + nm, name: nm, text });
    addFiles(files);
    state.active = Math.max(0, Math.min(state.datasets.length - 1, emb.active || 0));
    document.getElementById("msg").textContent = "";
  }
} catch (e) { document.getElementById("msg").textContent = "內建範例資料讀取失敗：" + e.message; }
render();
</script>
